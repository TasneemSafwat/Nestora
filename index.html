<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#242522" />
    <title>NESTORA — Exceptional Properties in Saudi Arabia</title>
    <meta
      name="description"
      content="NESTORA is a premium real estate agency in Saudi Arabia. Discover exceptional villas, apartments, penthouses and commercial properties with thoughtful, expert guidance."
    />
    <meta property="og:title" content="NESTORA — Exceptional Properties in Saudi Arabia" />
    <meta
      property="og:description"
      content="Exceptional properties. Thoughtful guidance. A better way to find your next home."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#242522;color:#E7DDCB;transition:opacity .7s cubic-bezier(.22,1,.36,1),visibility .7s}
      #splash.done{opacity:0;visibility:hidden}
      #splash b{font:500 34px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.42em;padding-left:.42em;animation:sp 1.1s cubic-bezier(.22,1,.36,1) both}
      #splash i{display:block;height:1px;width:64px;background:#A68A5B;transform-origin:center;animation:sl 1.1s .15s cubic-bezier(.22,1,.36,1) both}
      @keyframes sp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes sl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><b>NESTORA</b><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Failsafe: never leave the splash covering the page.
      setTimeout(function () {
        var sp = document.getElementById('splash'), root = document.getElementById('root');
        if (!sp) return;
        if (root && !root.children.length) {
          sp.innerHTML = '<b style="font-size:16px;letter-spacing:.05em;text-align:center;padding:0 24px;line-height:1.8">App not running.<br>Open a terminal in the project folder and run:<br><code>npm install</code> then <code>npm run dev</code></b>';
        } else { sp.classList.add('done'); }
      }, 4000);
    </script>
  </body>
</html>
